name: gravel-max profile
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  brouter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch pinned BRouter
        run: git clone --depth 1 --branch v1.7.8 https://github.com/abrensch/brouter.git "$RUNNER_TEMP/brouter"
      - name: Check source-release integrity
        run: python -m unittest test_profile_release.py -q
      - name: Evaluate profile and route synthetic RD5 fixtures
        run: python scripts/test_brouter_profile.py --source "$RUNNER_TEMP/brouter" --deps "$RUNNER_TEMP/brouter-deps" --fetch-deps
      - name: Verify committed evidence matches the tree
        run: python scripts/check_release_tree.py --fresh output/current/profile-v1-validation/validation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-validation
          path: output/current/profile-v1-validation/
